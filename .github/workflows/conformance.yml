name: Conformance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - features
      - release/**
  pull_request:
    branches:
      - main
      - features
      - release/**

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-linux-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Check out immutable Valkey 9.1.0 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: valkey-io/valkey
          ref: c9e8005e9d0ec817e26c7db318861cb821409249
          path: .artifacts/valkey-src
          persist-credentials: false

      - name: Build exact Valkey test binary
        shell: bash
        run: |
          set -euo pipefail
          make -C .artifacts/valkey-src -j2 BUILD_TLS=no
          sudo install -o root -g root -m 0755 \
            .artifacts/valkey-src/src/valkey-server \
            /usr/local/bin/valkey-server
          rm -rf .artifacts/valkey-src
          valkey-server --version

      - name: Validate and run portable profile
        run: |
          make check-conformance
          make check-reference
          make conformance
          go -C tools test ./cmd/conformance \
            -run '^TestFullProfileRejectsMissingEximEvidence$'

      - name: Run real Postfix profile
        run: make conformance-postfix

      - name: Install the pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run portable security gates
        run: |
          make check-security
          make fuzz-security
          make race-security
          make vulnerability-security

      - name: Prove generated tree cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain deterministic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dkim2-conformance-reports
          path: .artifacts/
          if-no-files-found: error
          retention-days: 14
