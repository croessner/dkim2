name: Conformance

on:
  workflow_dispatch:
  push:
    branches: [main, features, "release/**"]
  pull_request:
    branches: [main, features, "release/**"]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=vendor
      DKIM2_TEST_TRUSTED_ROOT: /opt/dkim2-test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"

      - name: Prepare protected test root
        run: |
          sudo install -d -m 0700 "$DKIM2_TEST_TRUSTED_ROOT"
          sudo mount -t tmpfs -o "mode=0700,uid=$(id -u),gid=$(id -g),size=16m,nosuid,nodev,noexec" dkim2-test "$DKIM2_TEST_TRUSTED_ROOT"

      - name: Run portable conformance
        run: |
          make check-conformance
          make conformance

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dkim2-conformance
          path: .artifacts/conformance-portable/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
