# Performance-only equality indexes; correctness never depends on an index.
# Private key bytes are intentionally not indexed.
index objectClass,dkim2Generation,dkim2SchemaVersion,dkim2DatasetState eq
index dkim2HandleID,dkim2ProfileID,dkim2SigningDomain eq
index dkim2TenantID,dkim2ProfileUse,dkim2Algorithm,dkim2Selector eq
index dkim2CandidateDigest,dkim2OperationID,dkim2WasActive eq
index dkim2AdminLockOwner,dkim2AdminRevision eq
