name: Exim integration

on:
  workflow_dispatch:
  push:
    branches: [main, features, "release/**"]
    paths:
      - "lib/**"
      - "cmd/dkim2d/**"
      - "cmd/dkim2-exim/**"
      - "docs/specs/openapi/**"
      - "Makefile"
      - ".github/workflows/exim-integration.yml"
  pull_request:
    branches: [main, features, "release/**"]
    paths:
      - "lib/**"
      - "cmd/dkim2d/**"
      - "cmd/dkim2-exim/**"
      - "docs/specs/openapi/**"
      - "Makefile"
      - ".github/workflows/exim-integration.yml"

permissions:
  contents: read

concurrency:
  group: exim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"

      - name: Run Exim integration
        run: make integration-exim
