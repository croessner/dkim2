services:
  bootstrap:
    build:
      context: ../../..
      dockerfile: contrib/qualification/postfix-milter/Dockerfile
      target: stack
      pull: false
      args:
        BUILD_IMAGE: dkim2-postfix-qualification-build:verified
        DAEMON_IMAGE: dkim2-postfix-qualification-daemon:verified
        POSTFIX_IMAGE: dkim2-postfix-qualification-postfix:verified
    platform: linux/amd64
    command: ["bootstrap"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=0700
    volumes:
      - capabilities:/capabilities
    networks:
      - qualification
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.50

  daemon:
    build:
      context: ../../..
      dockerfile: contrib/qualification/postfix-milter/Dockerfile
      target: daemon
      pull: false
      args:
        BUILD_IMAGE: dkim2-postfix-qualification-build:verified
        DAEMON_IMAGE: dkim2-postfix-qualification-daemon:verified
        POSTFIX_IMAGE: dkim2-postfix-qualification-postfix:verified
    platform: linux/amd64
    command: ["daemon"]
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=0700
    volumes:
      - capabilities:/capabilities:ro
      - daemon-jail:/jail
    networks:
      - qualification
    dns:
      - 127.0.0.1
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/qualify", "health-daemon"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.00

  stack:
    build:
      context: ../../..
      dockerfile: contrib/qualification/postfix-milter/Dockerfile
      target: stack
      pull: false
      args:
        BUILD_IMAGE: dkim2-postfix-qualification-build:verified
        DAEMON_IMAGE: dkim2-postfix-qualification-daemon:verified
        POSTFIX_IMAGE: dkim2-postfix-qualification-postfix:verified
    platform: linux/amd64
    command: ["stack"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:mode=0755
      - /tmp:mode=1777
    volumes:
      - capabilities:/capabilities:ro
      - milter-jail:/milter-jail
    network_mode: "service:daemon"
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/qualify", "health-stack"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 3s
    pids_limit: 128
    mem_limit: 384m
    cpus: 1.50

volumes:
  capabilities:
  daemon-jail:
  milter-jail:

networks:
  qualification:
    internal: true
