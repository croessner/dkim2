name: Guardrails

on:
  workflow_dispatch:
  push:
    branches: [main, features, "release/**"]
  pull_request:
    branches: [main, features, "release/**"]

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOFLAGS: -mod=vendor
      DKIM2_TEST_TRUSTED_ROOT: /dkim2-test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.work.sum
            lib/go.sum
            cmd/dkim2d/go.sum
            cmd/dkim2-milter/go.sum
            cmd/dkim2-exim/go.sum
            cmd/dkim2ctl/go.sum
            tools/go.sum

      - name: Prepare protected test root
        run: |
          sudo install -d -m 0700 "$DKIM2_TEST_TRUSTED_ROOT"
          truncate -s 512M "$RUNNER_TEMP/dkim2-test.ext4"
          mkfs.ext4 -q -F "$RUNNER_TEMP/dkim2-test.ext4"
          sudo mount -o loop,nosuid,nodev "$RUNNER_TEMP/dkim2-test.ext4" "$DKIM2_TEST_TRUSTED_ROOT"
          sudo chown "$(id -u):$(id -g)" "$DKIM2_TEST_TRUSTED_ROOT"

      - name: Install quality tools
        run: scripts/install-ci-tools.sh actionlint golangci-lint

      - name: Run guardrails
        env:
          TMPDIR: /dkim2-test
        run: make guardrails

      - name: Check generated and formatted source
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
