name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      created: ${{ steps.metadata.outputs.created }}
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable annotated tag and commit
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          revision="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$revision" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          created="$(date -u -d "@$source_date_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          {
            printf 'version=%s\n' "$RELEASE_TAG"
            printf 'revision=%s\n' "$revision"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
            printf 'created=%s\n' "$created"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install release quality tools
        run: scripts/install-ci-tools.sh actionlint golangci-lint govulncheck

      - name: Run release guardrails
        env:
          GOTMPDIR: ${{ runner.temp }}
        run: make release-guardrails

      - name: Check source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  create-release:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.quality.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.quality.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          previous_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)"
          if test -n "$previous_tag"; then
            ahead_by="$(gh api "repos/$GITHUB_REPOSITORY/compare/${previous_tag}...${RELEASE_TAG}" --jq '.ahead_by')"
            if test "$ahead_by" -eq 0; then
              echo "No new commits since $previous_tag; aborting release creation."
              exit 1
            fi
          fi

          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          scripts/generate-release-notes.sh "$RELEASE_TAG" "$previous_tag" >"$notes_file"

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DKIM2 $RELEASE_TAG" \
            --notes-file "$notes_file" \
            --generate-notes \
            --latest

  publish:
    needs: [quality, create-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        product: [dkim2d, dkim2-milter, dkim2ctl, dkim2-dsn-propagator]
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.quality.outputs.version }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image repository
        id: image
        env:
          PRODUCT: ${{ matrix.product }}
        run: printf 'repository=ghcr.io/%s/%s\n' "$GITHUB_REPOSITORY_OWNER" "$PRODUCT" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: build/container/Dockerfile
          target: ${{ matrix.product }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ needs.quality.outputs.version }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.quality.outputs.version }}
            REVISION=${{ needs.quality.outputs.revision }}
            SOURCE_DATE_EPOCH=${{ needs.quality.outputs.source_date_epoch }}
            CREATED=${{ needs.quality.outputs.created }}
            DIRTY=clean

      - name: Install pinned vulnerability scanner
        run: scripts/fetch-image-tools.sh

      - name: Scan exact image digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: >-
          .artifacts/image-tools/trivy image --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Smoke-test exact image digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m
          "$IMAGE" --help
