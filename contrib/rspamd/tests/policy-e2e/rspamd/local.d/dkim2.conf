enabled = true;
endpoint = "http://127.0.0.1:8080/v1/process";
transport = "loopback";
capability_file = "/etc/dkim2/protected/process-capability";
timeout = 2.0;
max_response_bytes = 262144;
failure_mode = "tempfail";

retry_cache {
  secret_file = "/etc/dkim2/protected/rspamd-retry-hmac";
  authority_generation = "policy-e2e-v1";
  ttl_ms = 600000;
  lease_ms = 30000;
  redis {
    servers = "redis:6379";
    db = 0;
    timeout = 1.0;
  }
}

nauthilus {
  endpoint = "https://policy-observer:9444/api/v1/policy/decisions";
  server_name = "policy-observer";
  username = "rspamd-verifier";
  password_file = "/etc/dkim2/protected/nauthilus-policy-password";
  instance = "policy-e2e-mx";
  timeout = 2.0;
  max_response_bytes = 65536;
  client_class = "untrusted";
  mail_from_class = "external";
  recipient_classes = ["local"];
  received_dsn_attribute = true;
}

# Independent observations are sealed before Policy and durably acknowledged afterward.
observation {
  mode = "asynchronous";
  source = "scan";
  instance = "policy-e2e-mx";
  endpoint = "https://policy-observer:9444/api/v1/policy/decisions";
  server_name = "policy-observer";
  username = "ScanWriter";
  password_file = "/etc/dkim2/protected/observation-password";
  timeout = 2.0;
  max_response_bytes = 65536;
  failure_action = "tempfail";
  outbox {
    allocation_key { file = "/etc/dkim2/protected/outbox-allocation"; }
    active_key { file = "/etc/dkim2/protected/outbox-encryption-active"; }
    previous_key { file = "/etc/dkim2/protected/outbox-encryption-previous"; }
    shard_count = 4;
    drain_generation = 0;
    max_records = 256;
    max_encrypted_bytes = 16777216;
    max_age_ms = 300000;
    lease_ms = 15000;
    max_attempts = 32;
    backoff_min_ms = 250;
    backoff_max_ms = 3000;
    jitter_ms = 100;
    tombstone_limit = 256;
    tombstone_ttl_ms = 60000;
    poll_interval = 0.25;
    sweep_interval = 0.25;
    redis {
      servers = "outbox-redis:6379";
      username = "outbox";
      password_file = "/etc/dkim2/protected/outbox-password";
      ssl = true;
      no_ssl_verify = false;
      ssl_ca = "/etc/ssl/certs/policy-e2e-ca.crt";
      sni = "outbox-redis";
      timeout = 1.0;
    }
  }
}
