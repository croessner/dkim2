        - invalid_recipe_json
        - duplicate_selector
        - too_many_signatures
        - missing_protocol
        - sequence_invalid
        - unsupported_algorithm
        - hash_mismatch
        - signature_mismatch
        - missing_key
        - invalid_key
        - ambiguous_key
        - revoked_key
        - unsupported_key_type
        - key_algorithm_mismatch
        - provider_temporary
        - provider_permanent
        - provider_contract
        - timestamp_invalid
        - envelope_mismatch
        - domain_alignment_mismatch
        - next_domain_mismatch
        - out_of_band_required
        - internal_contract
    PolicyReason:
