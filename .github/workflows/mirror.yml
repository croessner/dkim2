name: Public Mirror

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-mirror
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'go-dkim2/dkim2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone canonical repository
        run: git clone --bare "https://github.com/croessner/dkim2.git" "$RUNNER_TEMP/repository.git"

      - name: Create target-scoped mirror token
        id: mirror-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DKIM2_MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DKIM2_MIRROR_APP_PRIVATE_KEY }}
          owner: go-dkim2
          repositories: dkim2
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: false

      - name: Synchronize branches and tags
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git -C "$RUNNER_TEMP/repository.git" remote add mirror "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/repository.git" push --prune mirror '+refs/heads/*:refs/heads/*'
          git -C "$RUNNER_TEMP/repository.git" push --prune mirror 'refs/tags/*:refs/tags/*'
