openapi: 3.1.0
info:
  title: DKIM2 Daemon API
  version: 0.1.0-draft
  description: >
    Draft OpenAPI contract for the DKIM2 reference daemon. This contract is
    intentionally minimal until protocol behavior and result models are
    implemented.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report service readiness.
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: The service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/process:
    post:
      operationId: processMessage
      summary: Process a DKIM2 message through the daemon action planner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRequest"
      responses:
        "200":
          description: Processing completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Temporary service failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        reason:
          type: string
    ProcessRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - operation
        - smtp
        - message
      properties:
        api_version:
          type: string
          const: v1
        operation:
          type: string
          enum:
            - verify
            - sign
            - revise
            - process
        smtp:
          $ref: "#/components/schemas/SMTPEnvelope"
        message:
          $ref: "#/components/schemas/RawMessageInput"
        options:
          $ref: "#/components/schemas/ProcessOptions"
    SMTPEnvelope:
      type: object
      additionalProperties: false
      required:
        - mail_from
        - rcpt_to
      properties:
        mail_from:
          type: string
          description: RFC 5321 MAIL FROM path, including angle brackets.
        rcpt_to:
          type: array
          minItems: 1
          items:
            type: string
            description: RFC 5321 RCPT TO path, including angle brackets.
        helo:
          type: string
        remote_ip:
          type: string
    RawMessageInput:
      type: object
      additionalProperties: false
      required:
        - format
        - raw_rfc5322_base64
      properties:
        format:
          type: string
          const: raw_rfc5322_base64
        raw_rfc5322_base64:
          type: string
          contentEncoding: base64
    ProcessOptions:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - inbound
            - outbound
            - test
        policy:
          type: string
          enum:
            - strict
            - permissive
            - testing
        add_authentication_results:
          type: boolean
    ProcessResponse:
      type: object
      additionalProperties: false
      required:
        - api_version
        - result
        - verdict
        - actions
      properties:
        api_version:
          type: string
          const: v1
        result:
          type: string
          enum:
            - pass
            - fail
            - tempfail
            - permerror
            - neutral
        verdict:
          type: string
          enum:
            - accept
            - reject
            - tempfail
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
    Action:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - add_header
            - change_header
            - delete_header
            - replace_body
            - quarantine
        name:
          type: string
        value:
          type: string
    Finding:
      type: object
      additionalProperties: false
      required:
        - code
        - severity
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
            - info
            - warning
            - error
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
