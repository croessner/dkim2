# Illustrative least-privilege split. Replace only the example DNs.
access to attrs=DKIMKey
    by dn.exact="cn=dkim2-protected-import,ou=services,dc=example,dc=test" read
    by * none
access to dn.subtree="ou=generations,ou=dkim2,dc=example,dc=test"
    attrs=entry,objectClass,cn,dkim2SchemaVersion,dkim2Generation,dkim2DatasetState,dkim2HandleID,dkim2ProfileID,dkim2SigningDomain,dkim2RecordStatus,dkim2NotBefore,dkim2NotAfter,dkim2Algorithm,dkim2Selector,dkim2PublicKeySPKI,dkim2TenantID,dkim2ProfileUse,dkim2Rollout,dkim2Compatibility,dkim2FeedbackRouteID
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" write
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" write
    by * none
