# Load the local DKIM2 verifier configuration without shipping deployment
# credentials or site-specific policy in the contrib module.
dkim2 {
  .include(try=true,priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/dkim2.conf"
  .include(try=true,priority=10) "$LOCAL_CONFDIR/override.d/dkim2.conf"
}
