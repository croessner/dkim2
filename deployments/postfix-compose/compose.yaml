name: dkim2-postfix

x-product-security: &product-security
  user: "2000:2000"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  ulimits:
    nofile:
      soft: 1024
      hard: 1024
  mem_limit: 256m
  cpus: 1.0
  stop_grace_period: 15s
  restart: "no"

x-daemon: &daemon
  <<: *product-security
  build:
    context: ../..
    dockerfile: build/container/Containerfile
    target: dkim2d
    args:
      VERSION: ${DKIM2_VERSION:-0.0.0-dev}
      REVISION: ${DKIM2_REVISION:?set DKIM2_REVISION to the exact 40-character source revision}
      SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?set SOURCE_DATE_EPOCH to the trusted release timestamp}
      CREATED: ${DKIM2_CREATED:?set DKIM2_CREATED to the RFC3339 release timestamp}
      DIRTY: ${DKIM2_DIRTY:-clean}
  image: ${DKIM2D_IMAGE:-dkim2d:local}
  command: ["serve", "--config", "/etc/dkim2d/config.yaml"]
  healthcheck:
    test: ["CMD", "/usr/local/bin/dkim2d", "probe"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 5s
  volumes:
    - type: bind
      source: ./state/daemon/inbound
      target: /var/lib/dkim2d
      read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=2000,gid=2000

x-milter: &milter
  <<: *product-security
  user: "2000:103"
  build:
    context: ../..
    dockerfile: build/container/Containerfile
    target: dkim2-milter
    args:
      VERSION: ${DKIM2_VERSION:-0.0.0-dev}
      REVISION: ${DKIM2_REVISION:?set DKIM2_REVISION to the exact 40-character source revision}
      SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?set SOURCE_DATE_EPOCH to the trusted release timestamp}
      CREATED: ${DKIM2_CREATED:?set DKIM2_CREATED to the RFC3339 release timestamp}
      DIRTY: ${DKIM2_DIRTY:-clean}
  image: ${DKIM2_MILTER_IMAGE:-dkim2-milter:local}
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=2000,gid=2000

services:
  daemon-inbound:
    <<: *daemon
    networks: [daemon-control]
    volumes:
      - type: bind
        source: ./state/daemon/inbound
        target: /var/lib/dkim2d
        read_only: true
      - type: bind
        source: ./config/dkim2d-inbound.yaml
        target: /etc/dkim2d/config.yaml
        read_only: true

  milter-inbound:
    <<: *milter
    command: ["serve", "--config", "/etc/dkim2-milter/inbound.yaml"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/dkim2-milter", "probe", "--config", "/etc/dkim2-milter/inbound.yaml"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s
    network_mode: "service:daemon-inbound"
    volumes:
      - type: bind
        source: ./state/sockets/inbound
        target: /run/dkim2
      - type: bind
        source: ./state/milter/inbound
        target: /etc/dkim2-milter
        read_only: true
    depends_on:
      daemon-inbound:
        condition: service_healthy

  daemon-originator:
    <<: *daemon
    networks: [daemon-control]
    volumes:
      - type: bind
        source: ./state/daemon/originator
        target: /var/lib/dkim2d
        read_only: true
      - type: bind
        source: ./config/dkim2d-originator.yaml
        target: /etc/dkim2d/config.yaml
        read_only: true

  milter-originator:
    <<: *milter
    command: ["serve", "--config", "/etc/dkim2-milter/originator.yaml"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/dkim2-milter", "probe", "--config", "/etc/dkim2-milter/originator.yaml"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s
    network_mode: "service:daemon-originator"
    volumes:
      - type: bind
        source: ./state/sockets/originator
        target: /run/dkim2
      - type: bind
        source: ./state/milter/originator
        target: /etc/dkim2-milter
        read_only: true
    depends_on:
      daemon-originator:
        condition: service_healthy

  daemon-transit:
    <<: *daemon
    networks: [daemon-control]
    volumes:
      - type: bind
        source: ./state/daemon/transit
        target: /var/lib/dkim2d
        read_only: true
      - type: bind
        source: ./config/dkim2d-transit.yaml
        target: /etc/dkim2d/config.yaml
        read_only: true

  milter-transit:
    <<: *milter
    command: ["serve", "--config", "/etc/dkim2-milter/transit.yaml"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/dkim2-milter", "probe", "--config", "/etc/dkim2-milter/transit.yaml"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 5s
    network_mode: "service:daemon-transit"
    volumes:
      - type: bind
        source: ./state/sockets/transit
        target: /run/dkim2
      - type: bind
        source: ./state/milter/transit
        target: /etc/dkim2-milter
        read_only: true
    depends_on:
      daemon-transit:
        condition: service_healthy

  postfix:
    image: chrroessner/postfix:3.11.5@sha256:13cd39ff85a2edece32bdf3a4cdaa123c1a7d91db0e296f840c3ffe3d9121a4d
    read_only: false
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "NET_BIND_SERVICE", "SETGID", "SETUID", "SYS_CHROOT"]
    group_add: ["103"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 30s
    restart: "no"
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    tmpfs:
      - /run:rw,nosuid,nodev,size=32m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/lib/postfix:rw,nosuid,nodev,size=32m,mode=0755
    volumes:
      - postfix-queue:/var/spool/postfix
      - postfix-config:/etc/postfix
      - type: bind
        source: ./state/sockets/inbound
        target: /run/dkim2/inbound
        read_only: true
      - type: bind
        source: ./state/sockets/originator
        target: /run/dkim2/originator
        read_only: true
      - type: bind
        source: ./state/sockets/transit
        target: /run/dkim2/transit
        read_only: true
      - type: bind
        source: ./postfix/main.cf
        target: /etc/postfix/custom-config/main.cf
        read_only: true
      - type: bind
        source: ./postfix/master.cf
        target: /etc/postfix/custom-config/master.cf
        read_only: true
    networks:
      - mail
    depends_on:
      milter-inbound:
        condition: service_healthy
      milter-originator:
        condition: service_healthy
      milter-transit:
        condition: service_healthy

volumes:
  postfix-config:
  postfix-queue:

networks:
  daemon-control:
    internal: true
  mail:
    internal: true
