name: dkim2-policy-e2e

services:
  redis:
    image: valkey/valkey:8.1.10-alpine@sha256:cfb2aa4c8352930130fd45eb231a57310ac326d7323edae12b384b9270c46dda
    restart: "no"
    command: ["valkey-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - reputation-data:/data
    networks: [policy-e2e]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  fixture-setup:
    image: alpine:3.24
    restart: "no"
    network_mode: none
    profiles: [tools]
    command: ["sh", "/fixture/setup_private_files.sh"]
    volumes:
      - .:/fixture:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}:/input:ro
      - rspamd-secrets:/rspamd
      - nauthilus-secrets:/nauthilus
      - outbox-secrets:/outbox
      - outbox-data:/outbox-data

  outbox-redis:
    image: valkey/valkey:8.1.10-alpine@sha256:cfb2aa4c8352930130fd45eb231a57310ac326d7323edae12b384b9270c46dda
    user: "999:1000"
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - valkey-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /protected/outbox-redis.crt
      - --tls-key-file
      - /protected/outbox-redis.key
      - --tls-ca-cert-file
      - /protected/policy-e2e-ca.crt
      - --tls-auth-clients
      - "no"
      - --tls-protocols
      - TLSv1.3
      - --aclfile
      - /protected/outbox.acl
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --save
      - ""
      - --dir
      - /data
    volumes:
      - outbox-secrets:/protected:ro
      - outbox-data:/data
    networks: [policy-e2e]
    healthcheck:
      test: ["CMD", "valkey-cli", "--tls", "--sni", "outbox-redis", "--cacert", "/protected/policy-e2e-ca.crt", "--user", "health", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  dkim2-stub:
    image: python:3.13-alpine
    restart: "no"
    command:
      - python3
      - /fixture/dkim2_stub.py
      - --response
      - /fixture/dkim2-response.json
      - --replayed-response
      - /fixture/dkim2-replayed-response.json
      - --two-hop-response
      - /fixture/dkim2-two-hop-response.json
      - --received-dsn-response
      - /fixture/dkim2-received-dsn-response.json
      - --reputation-fixtures
      - /projections
      - --state
      - /state/dkim2-stub-state.json
      - --control
      - /state/dkim2-stub-control.json
    volumes:
      - .:/fixture:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/state:/state
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/projections:/projections:ro
    networks: [policy-e2e]
    ports:
      - 127.0.0.1:${POLICY_E2E_MILTER_PORT:-19900}:11332
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 1s
      retries: 30

  nauthilus-policy:
    image: ${POLICY_E2E_NAUTHILUS_IMAGE:?Nauthilus image is required}
    build:
      context: ${NAUTHILUS_REPO:?Nauthilus checkout is required}
      dockerfile: Dockerfile
      args:
        BUNDLED_NATIVE_PLUGINS: reputation geoip dkim2-intelligence
    restart: "no"
    command:
      - /usr/app/nauthilus
      - -config
      - /etc/nauthilus/nauthilus.yml
      - -config-format
      - yaml
    environment:
      POLICY_DKIM2_RSPAMD_PASSWORD: ${POLICY_E2E_PASSWORD:?Policy password is required}
      POLICY_E2E_REDIS_ENCRYPTION_SECRET: ${POLICY_E2E_REDIS_ENCRYPTION_SECRET:?Redis encryption secret is required}
      POLICY_E2E_REDIS_PASSWORD_NONCE: ${POLICY_E2E_REDIS_PASSWORD_NONCE:?Redis password nonce is required}
      POLICY_REPUTATION_PASSWORD: ${POLICY_E2E_OBSERVATION_PASSWORD:?observation password is required}
      POLICY_FIXTURE_SEED_PASSWORD: ${POLICY_E2E_SEED_PASSWORD:?fixture seed password is required}
      REPUTATION_PLUGIN_SHA256: ${REPUTATION_PLUGIN_SHA256:?reputation plugin checksum is required}
      GEOIP_PLUGIN_SHA256: ${GEOIP_PLUGIN_SHA256:?GeoIP plugin checksum is required}
      INTELLIGENCE_PLUGIN_SHA256: ${INTELLIGENCE_PLUGIN_SHA256:?intelligence plugin checksum is required}
      SSL_CERT_FILE: /etc/nauthilus/e2e/certs/policy-e2e-ca.crt
    volumes:
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/nauthilus.yml:/etc/nauthilus/nauthilus.yml:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/geoip.json:/etc/nauthilus/e2e/geoip.json:ro
      - nauthilus-secrets:/run/secrets:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/certs/nauthilus-policy.crt:/etc/nauthilus/e2e/certs/nauthilus-policy.crt:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/certs/nauthilus-policy.key:/etc/nauthilus/e2e/certs/nauthilus-policy.key:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/certs/policy-e2e-ca.crt:/etc/nauthilus/e2e/certs/policy-e2e-ca.crt:ro
    networks: [policy-e2e]
    ports:
      - 127.0.0.1:${POLICY_E2E_NAUTHILUS_PORT:-19443}:9443
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/app/healthcheck", "--url", "https://nauthilus-policy:9443/healthz"]
      interval: 1s
      timeout: 2s
      retries: 60

  policy-observer:
    image: python:3.13-alpine
    restart: "no"
    command:
      - python3
      - /fixture/policy_observer.py
      - --cert
      - /certs/nauthilus-policy.crt
      - --key
      - /certs/nauthilus-policy.key
      - --ca
      - /certs/policy-e2e-ca.crt
      - --state
      - /state/policy-observer-state.json
      - --control
      - /state/policy-observer-control.json
    volumes:
      - .:/fixture:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/state:/state
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/certs:/certs:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/protected/fixture-seed-password:/probe/seed-password:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/protected/observation-password:/probe/observation-password:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/protected/outbox-inspection-password:/probe/outbox-inspection-password:ro
    networks: [policy-e2e]
    depends_on:
      nauthilus-policy:
        condition: service_healthy

  rspamd:
    image: ${POLICY_E2E_RSPAMD_IMAGE:?canonical Rspamd image is required}
    restart: "no"
    network_mode: service:dkim2-stub
    depends_on:
      outbox-redis:
        condition: service_healthy
      redis:
        condition: service_healthy
      dkim2-stub:
        condition: service_healthy
      nauthilus-policy:
        condition: service_healthy
      policy-observer:
        condition: service_started
    volumes:
      - ../../plugins.d/dkim2.lua:/etc/rspamd/plugins.d/dkim2.lua:ro
      - ../../modules.local.d/dkim2.conf:/usr/share/rspamd/config/modules.local.d/dkim2.conf:ro
      - ../../lualib/dkim2:/usr/share/rspamd/config/lua/dkim2:ro
      - ${POLICY_E2E_RSPAMD_LOCAL_D:?runtime Rspamd local.d directory is required}:/etc/rspamd/local.d:ro
      - rspamd-secrets:/etc/dkim2/protected:ro
      - ${POLICY_E2E_RUNTIME:?runtime directory is required}/certs/policy-e2e-ca.crt:/etc/ssl/certs/policy-e2e-ca.crt:ro
    healthcheck:
      test: ["CMD", "rspamadm", "control", "stat"]
      interval: 1s
      timeout: 2s
      retries: 60

  miltertest:
    image: ${POLICY_E2E_MILTERTEST_IMAGE:?miltertest image is required}
    build:
      context: ${MILTERTEST_REPO:?miltertest-go checkout is required}
      dockerfile: Dockerfile
    profiles: [tools]
    networks: [policy-e2e]
    volumes:
      - .:/fixture:ro

networks:
  policy-e2e:
    internal: true

volumes:
  reputation-data:
  rspamd-secrets:
  nauthilus-secrets:
  outbox-secrets:
  outbox-data:
