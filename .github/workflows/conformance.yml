name: Conformance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  full-linux-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: "1.26.0"
          cache: false

      - name: Check out immutable Valkey 9.1.0 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: valkey-io/valkey
          ref: c9e8005e9d0ec817e26c7db318861cb821409249
          path: .artifacts/valkey-src
          persist-credentials: false

      - name: Build exact Valkey test binary
        shell: bash
        run: |
          set -euo pipefail
          make -C .artifacts/valkey-src -j2 BUILD_TLS=no
          sudo install -o root -g root -m 0755 \
            .artifacts/valkey-src/src/valkey-server \
            /usr/local/bin/valkey-server
          rm -rf .artifacts/valkey-src
          valkey-server --version

      - name: Validate and run portable profile
        run: |
          make check-conformance
          make check-reference
          make conformance

      - name: Run real Postfix profile
        run: make conformance-postfix

      - name: Run merged full profile
        run: make conformance-all

      - name: Install the pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run the closed security profile
        run: |
          make check-security
          make fuzz-security
          make race-security
          make vulnerability-security
          go -C tools run ./cmd/security -root .. report

      - name: Prove generated tree cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain deterministic reports
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: dkim2-conformance-reports
          path: .artifacts/
          if-no-files-found: error
          retention-days: 14
