name: Public Mirror

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-mirror
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'go-dkim2/dkim2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Synchronize branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --bare "https://github.com/croessner/dkim2.git" "$RUNNER_TEMP/repository.git"
          git -C "$RUNNER_TEMP/repository.git" remote add mirror "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/repository.git" push --prune mirror 'refs/heads/*:refs/heads/*'
          git -C "$RUNNER_TEMP/repository.git" push --prune mirror 'refs/tags/*:refs/tags/*'
