name: Unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - features
      - release/**
  pull_request:
    branches:
      - main
      - features
      - release/**

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare protected CI temporary directory
        id: ci_environment
        run: scripts/prepare-ci-environment.sh prepare

      - name: Install exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.work.sum
            lib/go.sum
            cmd/dkim2d/go.sum
            cmd/dkim2-milter/go.sum
            cmd/dkim2-exim/go.sum
            cmd/dkim2ctl/go.sum
            tools/go.sum

      - name: Run unit tests
        env:
          GOFLAGS: -mod=vendor
        run: make test

      - name: Remove protected CI temporary directory
        if: ${{ always() && steps.ci_environment.outcome == 'success' }}
        run: scripts/prepare-ci-environment.sh cleanup
