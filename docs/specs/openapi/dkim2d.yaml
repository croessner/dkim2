openapi: 3.0.3
info:
  title: DKIM2 Daemon API
  version: 0.1.0-rc.1
  description: >
    Verification, signing, revision, policy, and replay API for the DKIM2
    reference daemon. Protocol behavior is pinned to
    draft-ietf-dkim-dkim2-spec-06.
paths:
  /metrics:
    get:
      operationId: getMetrics
      summary: Report process-local Prometheus metrics.
      description: >
        Returns one deterministic bounded text exposition from the
        instance-owned registry. The scrape is unauthenticated, untraced, and
        independent of service readiness.
      security: []
      responses:
        "200":
          description: The bounded metrics exposition.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            text/plain:
              schema:
                type: string
                maxLength: 262144
        "400":
          $ref: "#/components/responses/BadRequest"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness.
      description: Returns the closed process-liveness representation.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      operationId: headHealth
      summary: Report process liveness without a response body.
      description: >
        Returns the same status and representation metadata, including
        Content-Type and the GET representation's Content-Length, as
        getHealth, but emits no response body. A 304 response instead has
        neither Content-Type nor Content-Length and uses only its declared
        minimal metadata.
      security: []
      responses:
        "200":
          description: The process is alive; no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >
            The request is invalid. Headers, including Content-Type and
            Content-Length, are identical to the corresponding GET response;
            no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "412":
          description: >
            A request precondition failed. Headers, including Content-Type and
            Content-Length, are identical to the corresponding GET response;
            no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "417":
          description: >
            The expectation is unsupported. Headers, including Content-Type
            and Content-Length, are identical to the corresponding GET
            response; no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "500":
          description: >
            An internal contract failure occurred. Headers, including
            Content-Type and Content-Length, are identical to the
            corresponding GET response; no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report service readiness.
      description: Returns readiness only after every required dependency is ready.
      security: []
      responses:
        "200":
          description: The service is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      operationId: headReadiness
      summary: Report service readiness without a response body.
      description: >
        Returns the same status and representation metadata, including
        Content-Type and the GET representation's Content-Length, as
        getReadiness, but emits no response body. A 304 response instead has
        neither Content-Type nor Content-Length and uses only its declared
        minimal metadata.
      security: []
      responses:
        "200":
          description: The service is ready; no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            ETag:
              $ref: "#/components/headers/ETag"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          description: >
            The request is invalid. Headers, including Content-Type and
            Content-Length, are identical to the corresponding GET response;
            no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "412":
          description: >
            A request precondition failed. Headers, including Content-Type and
            Content-Length, are identical to the corresponding GET response;
            no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "417":
          description: >
            The expectation is unsupported. Headers, including Content-Type
            and Content-Length, are identical to the corresponding GET
            response; no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "500":
          description: >
            An internal contract failure occurred. Headers, including
            Content-Type and Content-Length, are identical to the
            corresponding GET response; no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "503":
          description: >
            The service is not ready. Headers, including Content-Type and
            Content-Length, are identical to the corresponding GET response;
            no response body is emitted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
  /v1/process:
    post:
      operationId: processMessage
      summary: Process one inbound DKIM2 message.
      description: >
        Classifies DKIM2 applicability before verification. A message with no
        Message-Instance and no DKIM2-Signature fields returns 204 without
        starting verification, policy, replay, DNS, or mutation work. An
        applicable message is verified, receives server-owned policy and the
        configured replay check, and returns a closed final disposition. This
        operation neither signs nor revises a message.
      security:
        - localCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRequest"
      responses:
        "200":
          description: Processing completed with a coherent domain result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResponse"
        "204":
          description: >
            DKIM2 verification is not applicable because both DKIM2 protocol
            field families are absent. The caller continues without a
            terminal decision or mutation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sign:
    post:
      operationId: signMessage
      summary: Sign one originator DKIM2 message.
      description: >
        Resolves server-owned originator policy and signing material and
        returns a closed ordered append-only action plan.
      security:
        - localCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRequest"
      responses:
        "200":
          description: Originator signing completed with a coherent result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "204":
          description: >
            Originator signing is not applicable because the authoritative
            exact signing policy or profile is absent or inactive. The caller
            continues without a terminal decision or mutation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/revise:
    post:
      operationId: reviseMessage
      summary: Revise one ordinary-transit DKIM2 message.
      description: >
        Verifies exact inherited revision evidence before server-owned
        ordinary-transit signing and returns a closed ordered action plan.
      security:
        - localCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseRequest"
      responses:
        "200":
          description: Ordinary-transit revision completed coherently.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/dsn/sign:
    post:
      operationId: signDeliveryStatus
      summary: Sign one delivery-status report.
      description: >
        Authenticates a Postfix bounce(8) RFC 6522 multipart/report containing
        RFC 3464 delivery-status content, supplied by the separately authorized
        Postfix DSN adapter, requires its exact null reverse-path envelope, and
        authenticates the embedded DKIM2 object without fabricating original
        SMTP envelope evidence before returning an
        append-only DKIM2 signing action plan. This dedicated operation never
        accepts an ordinary sign or revision capability. Possession of the
        distinct DSN signing capability attests that the adapter established
        trusted Postfix internal origin before invoking this route.
      security:
        - dsnSignCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DSNSignRequest"
      responses:
        "200":
          description: Delivery-status signing completed with a coherent result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/dsn/propagate:
    post:
      operationId: propagateDeliveryStatus
      summary: Rebuild and sign one propagated delivery-status notification.
      description: >
        Evaluates one received RFC 6522 delivery-status notification whose
        embedded original is DKIM2 signed, proves that this system is the
        signing hop the notification was addressed to, rebuilds the state the
        previous hop signed, and returns a signed notification addressed to
        that previous hop together with an opaque commit token. The route
        reserves a distinct propagation replay coordinate before rebuilding
        and returns the coordinate to the caller only through that token; the
        caller commits it after its own re-injection succeeded. This dedicated
        operation never accepts a process, originator-signing, revision, or
        delivery-status signing capability.
      security:
        - dsnPropagateCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DSNPropagateRequest"
      responses:
        "200":
          description: Propagation completed with a coherent domain result.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DSNPropagateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/dsn/propagate/commit:
    post:
      operationId: commitDeliveryStatusPropagation
      summary: Commit one reserved delivery-status propagation coordinate.
      description: >
        Moves the propagation replay coordinate bound to the supplied commit
        token from pending to committed. The caller invokes this operation
        only after its own re-injection of the signed notification was
        accepted. The operation is idempotent for an already committed
        coordinate. A token that is unknown, malformed, or outside the
        retention window is answered 409 so that the caller defers instead of
        leaving the coordinate uncommitted.
      security:
        - dsnPropagateCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DSNPropagateCommitRequest"
      responses:
        "200":
          description: The propagation coordinate is committed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Content-Type-Options:
              $ref: "#/components/headers/ContentTypeOptions"
            Content-Length:
              $ref: "#/components/headers/ContentLength"
            Connection:
              $ref: "#/components/headers/Connection"
            Date:
              $ref: "#/components/headers/Date"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DSNPropagateCommitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "417":
          $ref: "#/components/responses/ExpectationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    localCapability:
      type: apiKey
      in: header
      name: X-DKIM2-Capability
      description: >
        Generation-bound local process capability. This credential is not an
        OAuth bearer token and is not intended for remote transport.
    dsnSignCapability:
      type: apiKey
      in: header
      name: X-DKIM2-DSN-Sign-Capability
      description: >
        Generation-bound local delivery-status signing capability. This
        credential is distinct from process, originator-signing, and revision
        capabilities and is not intended for remote transport.
    dsnPropagateCapability:
      type: apiKey
      in: header
      name: X-DKIM2-DSN-Propagate-Capability
      description: >
        Generation-bound local delivery-status propagation capability. This
        credential is distinct from the process, originator-signing, revision,
        and delivery-status signing capabilities, is accepted on the
        propagation and propagation-commit routes only, and is not intended
        for remote transport.
  headers:
    CacheControl:
      description: Prevent storage of every daemon response.
      required: true
      schema:
        type: string
        enum:
          - no-store
    ContentTypeOptions:
      description: Prevent content-type sniffing.
      required: true
      schema:
        type: string
        enum:
          - nosniff
    ContentLength:
      description: Canonical non-negative decimal representation length.
      required: true
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]*)$"
    ETag:
      description: Strong validator for the exact selected status representation.
      required: true
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    Connection:
      description: Close the accepted connection after this response.
      required: true
      schema:
        type: string
        enum:
          - close
    Date:
      description: RFC 9110 origin-server date when a valid clock is available.
      schema:
        type: string
        pattern: "^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), [0-9]{2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) [0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2} GMT$"
    RetryAfter:
      description: Fixed retry delay in seconds.
      required: true
      schema:
        type: string
        enum:
          - "1"
  responses:
    NotModified:
      description: >
        The selected status representation matches the request validator. No
        response content is emitted.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Connection:
          $ref: "#/components/headers/Connection"
        ETag:
          $ref: "#/components/headers/ETag"
        Date:
          $ref: "#/components/headers/Date"
    BadRequest:
      description: The request is invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The local process capability is absent or invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTimeout:
      description: The request body could not be received before the timeout.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The framed request body exceeds the fixed limit.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: The request media type is unsupported.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExpectationFailed:
      description: The request expectation is unsupported.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PreconditionFailed:
      description: A status-representation precondition failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >
        The supplied propagation commit token does not resolve to a
        reserved coordinate.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An internal contract failure occurred.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required service or dependency is not ready.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Length:
          $ref: "#/components/headers/ContentLength"
        Connection:
          $ref: "#/components/headers/Connection"
        Date:
          $ref: "#/components/headers/Date"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ProcessRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - message
        - smtp
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        message:
          $ref: "#/components/schemas/MessageInput"
        smtp:
          $ref: "#/components/schemas/SMTPInput"
        reporting:
          description: >
            Optional daemon reporting authority. When supplied for an inbound
            accept or non-terminal continue outcome, the daemon returns the
            exact Authentication-Results action; adapters must not synthesize it.
          allOf:
            - $ref: "#/components/schemas/ReportingContext"
        context:
          description: >
            Optional administrative tenant. Received delivery-status locality
            is tenant-keyed, so a request without this member and without a
            configured daemon default keeps the delivery-status projection
            unevaluated instead of guessing an authority.
          allOf:
            - $ref: "#/components/schemas/ProcessContext"
    SignRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - message
        - smtp
        - context
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        message:
          $ref: "#/components/schemas/MessageInput"
        smtp:
          $ref: "#/components/schemas/SMTPInput"
        context:
          $ref: "#/components/schemas/SigningContext"
    ReviseRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - message
        - smtp
        - incoming_smtp
        - context
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        message:
          $ref: "#/components/schemas/MessageInput"
        smtp:
          $ref: "#/components/schemas/SMTPInput"
        incoming_smtp:
          description: >
            Exact inherited envelope evidence verified before revision.
            The smtp member is the distinct outgoing signing envelope.
          allOf:
            - $ref: "#/components/schemas/SMTPInput"
        context:
          $ref: "#/components/schemas/SigningContext"
    DSNSignRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - message
        - outer_smtp
        - context
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        message:
          description: >
            Postfix Milter-reconstructed RFC 5322 DSN bytes. The authenticated
            route, not a caller-selected body field, fixes this representation.
          allOf:
            - $ref: "#/components/schemas/DSNMessageInput"
        outer_smtp:
          description: >
            Exact observed envelope of the DSN itself. mail_from must be <> and
            rcpt_to must contain exactly one recipient.
          allOf:
            - $ref: "#/components/schemas/SMTPInput"
        context:
          description: >
            Administrative tenant only. The daemon derives the exact signing
            domain from the cryptographically authenticated highest embedded
            DKIM2 d= value before resolving delivery_status policy.
          allOf:
            - $ref: "#/components/schemas/DeliveryStatusContext"
    DSNPropagateRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - message
        - outer_smtp
        - context
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        message:
          description: >
            Received RFC 6522 delivery-status notification bytes together with
            the caller's explicit representation claim.
          allOf:
            - $ref: "#/components/schemas/PropagationMessageInput"
        outer_smtp:
          description: >
            Exact observed envelope of the received notification itself.
            mail_from must be the null reverse path and rcpt_to must contain
            exactly the one local return-path address the notification was
            delivered to.
          allOf:
            - $ref: "#/components/schemas/PropagationSMTPInput"
        context:
          description: >
            Administrative tenant that owns local authority resolution and the
            canonical reporting MTA name rendered into the rebuilt report. The
            daemon derives the propagation signing domain from the
            cryptographically authenticated completion signature, never from
            this member.
          allOf:
            - $ref: "#/components/schemas/PropagationContext"
    PropagationMessageInput:
      type: object
      additionalProperties: false
      description: >
        Received delivery-status bytes for the propagation route. The
        representation claim is explicit because a locally delivered
        notification reaches the adapter over LMTP rather than as raw
        submission bytes.
      required:
        - raw_rfc5322_base64
        - fidelity
      properties:
        raw_rfc5322_base64:
          type: string
          format: byte
          minLength: 0
          maxLength: 44739244
        fidelity:
          type: string
          enum:
            - raw_rfc5322
            - lmtp_delivered_crlf
          x-enum-varnames:
            - PropagationFidelityRawRFC5322
            - PropagationFidelityLMTPDeliveredCRLF
    PropagationSMTPInput:
      type: object
      additionalProperties: false
      description: >
        Route-specific envelope evidence. It differs from the shared envelope
        schema because propagation admits exactly one forward path and records
        the observed SMTPUTF8 parameter of the delivering transaction.
      required:
        - mail_from
        - rcpt_to
        - smtputf8
      properties:
        mail_from:
          description: >
            Observed reverse path, which must be the null reverse path.
          type: string
          minLength: 0
          maxLength: 256
        rcpt_to:
          description: >
            The single observed forward path of the delivered notification.
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: false
          items:
            type: string
            minLength: 0
            maxLength: 256
        smtputf8:
          description: >
            Whether the delivering MAIL command carried the SMTPUTF8
            parameter. It records observed transport evidence of the received
            transaction only and is not an identity claim. It does not
            influence the response member smtputf8_required, which is derived
            from the rebuilt notification alone.
          type: boolean
    PropagationContext:
      type: object
      additionalProperties: false
      required:
        - tenant
        - reporting_mta
      properties:
        tenant:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        reporting_mta:
          description: >
            Canonical lowercase DNS name of the reporting MTA, used only in the
            rebuilt report and its outer From field.
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$"
    DSNPropagateCommitRequest:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - commit_token
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        commit_token:
          $ref: "#/components/schemas/PropagationCommitToken"
    DSNMessageInput:
      type: object
      additionalProperties: false
      required:
        - raw_rfc5322_base64
      properties:
        raw_rfc5322_base64:
          type: string
          format: byte
          minLength: 0
          maxLength: 44739244
    MessageInput:
      type: object
      additionalProperties: false
      required:
        - raw_rfc5322_base64
      properties:
        raw_rfc5322_base64:
          type: string
          format: byte
          minLength: 0
          maxLength: 44739244
        fidelity:
          type: string
          enum:
            - raw_rfc5322
            - milter_reconstructed_crlf
            - exim_local_scan_observed_crlf
            - exim_transport_filter_crlf
            - lmtp_delivered_crlf
    SMTPInput:
      type: object
      additionalProperties: false
      required:
        - mail_from
        - rcpt_to
      properties:
        mail_from:
          type: string
          minLength: 0
          maxLength: 256
        rcpt_to:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: false
          items:
            type: string
            minLength: 0
            maxLength: 256
    ProcessResponse:
      type: object
      additionalProperties: false
      description: >
        Applicable inbound processing result. Reject and tempfail carry no
        actions. Accept and non-terminal continue may carry the sole
        daemon-owned Authentication-Results reporting action.
      required:
        - api_version
        - draft
        - verification
        - authentication
        - policy
        - replay
        - disposition
        - actions
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        verification:
          $ref: "#/components/schemas/VerificationResult"
        verifier_projection:
          $ref: "#/components/schemas/VerifierProjection"
        authentication:
          $ref: "#/components/schemas/AuthenticationResult"
        policy:
          $ref: "#/components/schemas/PolicyResult"
        replay:
          $ref: "#/components/schemas/ReplayResult"
        disposition:
          $ref: "#/components/schemas/Disposition"
        actions:
          $ref: "#/components/schemas/ActionPlan"
        delivery_status:
          description: >
            Received delivery-status projection. Present only when the outer
            message has a null reverse path, a multipart/report delivery-status
            top level, and at least one DKIM2 protocol field family, and only
            when the outer DKIM2-Signature could be read; an unreadable outer
            signature is the outer verification's own permerror and carries no
            projection. Its presence changes neither verification,
            authentication, replay, nor action semantics.
          allOf:
            - $ref: "#/components/schemas/DeliveryStatusProjection"
    DeliveryStatusProjection:
      type: object
      additionalProperties: false
      description: >
        Closed received delivery-status evaluation projection. The stages are
        evaluated in member order and stop at the first failure, so a member is
        not_evaluated when an earlier stage stopped the evaluation or, for
        local_hop and propagation, when no tenant was available. not_evaluated
        never carries a temporary meaning; a temporary key or DNS failure is
        reported as embedded temperror and a temporary datasource failure as
        local_hop temperror. The propagation member is informational: it
        reports whether a propagation attempt could act on this notification.
      required:
        - structure
        - embedded
        - local_hop
        - outer_alignment
        - recipient_linkage
        - propagation
      properties:
        structure:
          type: string
          enum:
            - valid
            - malformed
            - limit_exceeded
          x-enum-varnames:
            - DeliveryStatusStructureValid
            - DeliveryStatusStructureMalformed
            - DeliveryStatusStructureLimitExceeded
        embedded:
          type: string
          enum:
            - verified
            - verified_headers_only
            - unverified
            - temperror
            - absent
            - not_evaluated
          x-enum-varnames:
            - DeliveryStatusEmbeddedVerified
            - DeliveryStatusEmbeddedVerifiedHeadersOnly
            - DeliveryStatusEmbeddedUnverified
            - DeliveryStatusEmbeddedTemperror
            - DeliveryStatusEmbeddedAbsent
            - DeliveryStatusEmbeddedNotEvaluated
        local_hop:
          type: string
          enum:
            - local
            - not_local
            - mismatch
            - temperror
            - not_evaluated
          x-enum-varnames:
            - DeliveryStatusLocalHopLocal
            - DeliveryStatusLocalHopNotLocal
            - DeliveryStatusLocalHopMismatch
            - DeliveryStatusLocalHopTemperror
            - DeliveryStatusLocalHopNotEvaluated
        outer_alignment:
          type: string
          enum:
            - aligned
            - misaligned
            - not_evaluated
          x-enum-varnames:
            - DeliveryStatusOuterAlignmentAligned
            - DeliveryStatusOuterAlignmentMisaligned
            - DeliveryStatusOuterAlignmentNotEvaluated
        recipient_linkage:
          type: string
          enum:
            - linked
            - unlinked
            - not_evaluated
          x-enum-varnames:
            - DeliveryStatusRecipientLinkageLinked
            - DeliveryStatusRecipientLinkageUnlinked
            - DeliveryStatusRecipientLinkageNotEvaluated
        propagation:
          type: string
          enum:
            - not_applicable
            - eligible
            - terminal_origin
            - not_failure
            - forbidden_null_previous_sender
            - unsupported_chain
            - not_reconstructable
            - not_evaluated
          x-enum-varnames:
            - DeliveryStatusPropagationNotApplicable
            - DeliveryStatusPropagationEligible
            - DeliveryStatusPropagationTerminalOrigin
            - DeliveryStatusPropagationNotFailure
            - DeliveryStatusPropagationForbiddenNullPreviousSender
            - DeliveryStatusPropagationUnsupportedChain
            - DeliveryStatusPropagationNotReconstructable
            - DeliveryStatusPropagationNotEvaluated
    ProcessContext:
      type: object
      additionalProperties: false
      required:
        - tenant
      properties:
        tenant:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
    DeliveryStatusContext:
      type: object
      additionalProperties: false
      required:
        - tenant
      properties:
        tenant:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
    SigningContext:
      type: object
      additionalProperties: false
      required:
        - tenant
        - domain
      properties:
        tenant:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        domain:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$"
    ReportingContext:
      type: object
      additionalProperties: false
      required:
        - authserv_id
      properties:
        authserv_id:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$"
    OperationResponse:
      type: object
      additionalProperties: false
      description: >
        Result and disposition are coherent: pass permits accept or continue,
        fail and permerror require reject, and temperror requires tempfail.
        Only accept may carry actions.
      required:
        - api_version
        - draft
        - operation
        - result
        - disposition
        - actions
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        operation:
          type: string
          enum:
            - sign
            - revise
            - delivery_status
        result:
          type: string
          enum:
            - pass
            - fail
            - permerror
            - temperror
        disposition:
          $ref: "#/components/schemas/Disposition"
        actions:
          $ref: "#/components/schemas/ActionPlan"
    Disposition:
      type: string
      enum:
        - accept
        - reject
        - tempfail
        - continue
    PropagationDisposition:
      type: string
      description: >
        Closed propagation disposition. It is distinct from the shared
        disposition because propagation adds discard, which answers a
        notification that must not be propagated and must not be reported as a
        failure, and because it never uses continue. Coherence with the
        operation result is fixed: pass permits accept or discard, permerror
        requires discard, fail requires reject, and temperror requires
        tempfail.
      enum:
        - accept
        - reject
        - discard
        - tempfail
      x-enum-varnames:
        - PropagationDispositionAccept
        - PropagationDispositionReject
        - PropagationDispositionDiscard
        - PropagationDispositionTempfail
    DSNPropagateResponse:
      type: object
      additionalProperties: false
      description: >
        Propagation result. Result and disposition are coherent under this
        operation's own rule: pass permits accept or discard, permerror
        requires discard, fail requires reject, and temperror requires
        tempfail. Only accept carries the propagation member, and only
        permerror carries the propagation_failure member. A notification that
        is not ours is a misrouting on this route and is reported as fail with
        reject, unlike the informational projection of the process route.
        The delivery_status member is present only when the received-DSN
        evaluation ran. It is absent when the notification carries no DKIM2
        field family at all and when the outer assessment was unusable,
        because the projection has no value for an assessment that never
        happened and a fabricated malformed structure would be false evidence.
      required:
        - api_version
        - draft
        - operation
        - result
        - disposition
        - replay
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        operation:
          type: string
          enum:
            - delivery_status_propagation
          x-enum-varnames:
            - PropagationOperationDeliveryStatusPropagation
        result:
          type: string
          enum:
            - pass
            - fail
            - permerror
            - temperror
          x-enum-varnames:
            - PropagationResultPass
            - PropagationResultFail
            - PropagationResultPermerror
            - PropagationResultTemperror
        disposition:
          $ref: "#/components/schemas/PropagationDisposition"
        delivery_status:
          description: >
            Closed received-DSN projection. Present only when the evaluation
            ran.
          allOf:
            - $ref: "#/components/schemas/DeliveryStatusProjection"
        replay:
          $ref: "#/components/schemas/ReplayResult"
        propagation_failure:
          description: >
            Permanent reason why no notification was produced. Present only
            with permerror.
          type: string
          enum:
            - not_reconstructable
            - unprovisioned_domain
          x-enum-varnames:
            - PropagationFailureNotReconstructable
            - PropagationFailureUnprovisionedDomain
        propagation:
          description: >
            Signed notification and its transport requirements. Present only
            with accept.
          allOf:
            - $ref: "#/components/schemas/PropagationOutput"
    PropagationOutput:
      type: object
      additionalProperties: false
      description: >
        Everything the caller needs to re-inject the signed notification and to
        commit the reserved propagation coordinate afterwards.
      required:
        - next_hop_recipient
        - smtputf8_required
        - eight_bit_mime_required
        - commit_token
        - raw_rfc5322_base64
      properties:
        next_hop_recipient:
          description: >
            Exact SMTP forward path of the previous hop, including angle
            brackets, taken from the authenticated previous-hop signature.
          type: string
          minLength: 3
          maxLength: 256
        smtputf8_required:
          description: >
            Whether the forward path or any header field of the signed
            notification carries a non-ASCII byte in the RFC 6531 and RFC 6532
            sense. An eight-bit body alone does not set it.
          type: boolean
        eight_bit_mime_required:
          description: >
            Whether the signed notification carries eight-bit body content, so
            that the re-injection client must negotiate 8BITMIME.
          type: boolean
        commit_token:
          $ref: "#/components/schemas/PropagationCommitToken"
        raw_rfc5322_base64:
          description: Complete signed notification bytes.
          type: string
          format: byte
          minLength: 0
          maxLength: 44739244
    PropagationCommitToken:
      type: string
      description: >
        Opaque bounded token bound to one reserved propagation coordinate, not
        to one issuing attempt. It carries no caller-readable structure and
        must not be logged.
      minLength: 16
      maxLength: 512
      pattern: "^[A-Za-z0-9_-]{16,512}$"
    DSNPropagateCommitResponse:
      type: object
      additionalProperties: false
      required:
        - api_version
        - draft
        - state
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        draft:
          $ref: "#/components/schemas/DraftVersion"
        state:
          type: string
          enum:
            - committed
          x-enum-varnames:
            - PropagationStateCommitted
    ActionPlan:
      type: array
      maxItems: 3
      items:
        $ref: "#/components/schemas/AddHeaderAction"
    AddHeaderAction:
      type: object
      additionalProperties: false
      required:
        - type
        - name
        - value
      properties:
        type:
          type: string
          enum:
            - add_header
        name:
          type: string
          enum:
            - Message-Instance
            - DKIM2-Signature
            - Authentication-Results
        value:
          type: string
          minLength: 1
          maxLength: 65535
          pattern: "^[^\\r\\n\\x00]+$"
    VerifierProjection:
      type: object
      additionalProperties: false
      description: Transport-neutral sealed verifier evidence for a complete ordinary authenticated chain.
      required:
        - schema
        - draft
        - binding_algorithm
        - binding
        - hops
      properties:
        schema:
          type: string
          enum:
            - dkim2.verifier-projection.v1
        draft:
          $ref: "#/components/schemas/DraftVersion"
        binding_algorithm:
          type: string
          enum:
            - sha-256
        binding:
          $ref: "#/components/schemas/SHA256Binding"
        hops:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/VerifierHop"
    VerifierHop:
      type: object
      additionalProperties: false
      required:
        - sequence
        - message_instance
        - hop_binding
        - signer_domain
        - signature_algorithms
        - signature_state
        - custody_transition
        - do_not_modify
        - do_not_explode
        - feedback
        - feed_here
        - exploded
        - recipe_mode
        - recipe_has_header_changes
        - recipe_body_mode
        - recipe_digest
        - change_classes
        - affected_headers
        - history_header_state
        - history_body_state
        - body_availability
        - change_count
        - affected_header_count
      properties:
        sequence:
          $ref: "#/components/schemas/CanonicalUint64"
        message_instance:
          $ref: "#/components/schemas/CanonicalUint64"
        hop_binding:
          $ref: "#/components/schemas/SHA256Binding"
        signer_domain:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$"
        signature_algorithms:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - rsa-sha256
              - rsa-sha512
              - ed25519-sha256
              - ed25519-sha512
            x-enum-varnames:
              - VerifierAlgorithmRSASHA256
              - VerifierAlgorithmRSASHA512
              - VerifierAlgorithmEd25519SHA256
              - VerifierAlgorithmEd25519SHA512
        signature_state:
          type: string
          enum:
            - pass
        custody_transition:
          type: string
          enum:
            - origin
            - ordinary
            - next_domain
            - terminal_next_domain
        do_not_modify:
          type: boolean
        do_not_explode:
          type: boolean
        feedback:
          type: boolean
        feed_here:
          type: boolean
        exploded:
          type: boolean
        recipe_mode:
          type: string
          enum:
            - unchanged
            - applied
        recipe_has_header_changes:
          type: boolean
        recipe_body_mode:
          type: string
          enum:
            - absent
            - steps
            - unavailable
        recipe_digest:
          $ref: "#/components/schemas/SHA256Binding"
        change_classes:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - body.rewrite
              - header.rewrite
        affected_headers:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9!#$%&'*+.^_`|~-]+$"
        history_header_state:
          $ref: "#/components/schemas/VerifierHistoryState"
        history_body_state:
          $ref: "#/components/schemas/VerifierHistoryState"
        body_availability:
          type: string
          enum:
            - known
            - unavailable
        change_count:
          type: integer
          minimum: 0
          maximum: 2
        affected_header_count:
          type: integer
          minimum: 0
          maximum: 128
    VerifierHistoryState:
      type: string
      enum:
        - matched
        - mismatch
        - unavailable
        - unsupported
    VerificationResult:
      type: object
      additionalProperties: false
      description: Message-local cryptographic evidence; replay may change the final authentication state.
      required:
        - state
        - primary_reason
        - scope
        - historical_content
        - historical_signatures
        - custody_structure
        - checks
        - signature_sets
      properties:
        state:
          $ref: "#/components/schemas/VerificationState"
        primary_reason:
          $ref: "#/components/schemas/VerificationReason"
        scope:
          type: string
          enum:
            - current
            - chain
        historical_content:
          type: string
          enum:
            - not_evaluated
            - complete
            - partial
        historical_signatures:
          type: string
          enum:
            - not_evaluated
            - complete
          x-enum-varnames:
            - VerificationResultHistoricalSignaturesNotEvaluated
            - VerificationResultHistoricalSignaturesComplete
        custody_structure:
          type: string
          enum:
            - not_evaluated
            - not_present
            - nd_links_evaluated
            - terminal_nd_requires_oob
        checks:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/VerificationCheck"
        signature_sets:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/SignatureSetResult"
        target:
          $ref: "#/components/schemas/VerificationTarget"
    VerificationTarget:
      type: object
      additionalProperties: false
      required:
        - sequence
        - instance
      properties:
        sequence:
          $ref: "#/components/schemas/CanonicalUint64"
        instance:
          $ref: "#/components/schemas/CanonicalUint64"
    VerificationCheck:
      type: object
      additionalProperties: false
      required:
        - class
        - reason
      properties:
        class:
          type: string
          enum:
            - message
            - protocol
            - body_hash
            - header_hash
            - signature
            - key
            - timestamp
            - envelope
            - domain_alignment
            - next_domain
            - provider
            - internal_contract
        reason:
          $ref: "#/components/schemas/VerificationReason"
    SignatureSetResult:
      type: object
      additionalProperties: false
      required:
        - algorithm
        - status
        - reason
        - key_policy
      properties:
        algorithm:
          type: string
          enum:
            - rsa-sha256
            - ed25519-sha256
            - unknown
        status:
          type: string
          enum:
            - pass
            - fail
            - permerror
            - temperror
            - ignored
        reason:
          $ref: "#/components/schemas/VerificationReason"
        key_policy:
          $ref: "#/components/schemas/KeyPolicyResult"
        selector:
          type: string
          description: Canonical selector for a failed supported signature; absent for every other result.
          minLength: 1
          maxLength: 253
          pattern: '^[A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?(?:\.[A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?)*$'
    KeyPolicyResult:
      type: object
      additionalProperties: false
      required:
        - testing_declared
        - strict_identity_declared
        - strict_identity_applicable
      properties:
        testing_declared:
          type: boolean
        strict_identity_declared:
          type: boolean
        strict_identity_applicable:
          type: boolean
          enum:
            - false
    PolicyResult:
      type: object
      additionalProperties: false
      required:
        - mode
        - verdict
        - primary_reason
        - do_not_modify
        - do_not_explode
        - dns_testing_effective
        - feedback
        - findings
      properties:
        mode:
          type: string
          enum:
            - strict
            - permissive
            - testing
        verdict:
          type: string
          enum:
            - accept
            - reject
            - tempfail
            - continue
        primary_reason:
          $ref: "#/components/schemas/PolicyReason"
        do_not_modify:
          type: string
          enum:
            - not_requested
            - indeterminate
            - not_evaluated
          x-enum-varnames:
            - PolicyResultDoNotModifyNotRequested
            - PolicyResultDoNotModifyIndeterminate
            - PolicyResultDoNotModifyNotEvaluated
        do_not_explode:
          type: string
          enum:
            - not_requested
            - violated
            - indeterminate
            - not_evaluated
          x-enum-varnames:
            - PolicyResultDoNotExplodeNotRequested
            - PolicyResultDoNotExplodeViolated
            - PolicyResultDoNotExplodeIndeterminate
            - PolicyResultDoNotExplodeNotEvaluated
        dns_testing_effective:
          type: boolean
        feedback:
          $ref: "#/components/schemas/PolicyFeedback"
        findings:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: "#/components/schemas/PolicyFinding"
    PolicyFeedback:
      type: object
      additionalProperties: false
      required:
        - requested
        - relay_required
        - history_coverage
      properties:
        requested:
          type: boolean
        relay_required:
          type: boolean
        history_coverage:
          type: string
          enum:
            - complete
            - indeterminate
            - not_evaluated
          x-enum-varnames:
            - PolicyFeedbackHistoryCoverageComplete
            - PolicyFeedbackHistoryCoverageIndeterminate
            - PolicyFeedbackHistoryCoverageNotEvaluated
        relay_sequence:
          $ref: "#/components/schemas/CanonicalUint64"
    PolicyFinding:
      type: object
      additionalProperties: false
      required:
        - reason
        - severity
      properties:
        reason:
          $ref: "#/components/schemas/PolicyReason"
        severity:
          type: string
          enum:
            - info
            - warning
            - permanent
            - temporary
        sequence:
          $ref: "#/components/schemas/CanonicalUint64"
    ReplayResult:
      type: object
      additionalProperties: false
      required:
        - class
      properties:
        class:
          type: string
          enum:
            - not_checked
            - disabled
            - first_seen
            - exploded
            - replayed
            - indeterminate
    AuthenticationResult:
      type: object
      additionalProperties: false
      required:
        - state
        - primary_reason
      properties:
        state:
          $ref: "#/components/schemas/VerificationState"
        primary_reason:
          type: string
          enum:
            - none
            - limit_exceeded
            - malformed_message
            - malformed_protocol
            - duplicate_hash_algorithm
            - invalid_recipe_json
            - duplicate_selector
            - too_many_signatures
            - missing_protocol
            - sequence_invalid
            - unsupported_algorithm
            - hash_mismatch
            - signature_mismatch
            - missing_key
            - invalid_key
            - ambiguous_key
            - revoked_key
            - unsupported_key_type
            - key_algorithm_mismatch
            - provider_temporary
            - provider_permanent
            - provider_contract
            - timestamp_invalid
            - envelope_mismatch
            - domain_alignment_mismatch
            - next_domain_mismatch
            - out_of_band_required
            - internal_contract
            - duplicate_message_without_exploded
            - replay_indeterminate
            - replay_evidence_unavailable
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - api_version
