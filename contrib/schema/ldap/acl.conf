# Deployable least-authority example. Replace only the suffix and exact role DNs.
# Rule order is security-significant. The state expressions use the generation
# captured from the target DN and become empty unless every root predicate is true.

# Service-account password verification is authentication-only.
access to attrs=userPassword
    by self =x
    by anonymous auth
    by * none

# Persistent backend-wide administration lock. Only the stager claims/releases it;
# snapshot and activation roles may observe it, and the legacy publisher is denied.
access to dn.exact="ou=dkim2,dc=example,dc=test"
    attrs=dkim2AdminLockOwner,dkim2AdminRevision
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" =dcsraz
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by * none

# Private key custody precedes every broader subtree rule.
access to dn.regex="^(.+,)?dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=dkim2PrivateKeyPKCS8
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by set.expand="(user & [cn=dkim2-stager,ou=services,dc=example,dc=test]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2SchemaVersion & [dkim2-datasource-v3]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2DatasetState & [staging]) + [dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2OperationID + [dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2CandidateDigest" =dcsra
    by set.expand="(user & [cn=dkim2-publisher,ou=services,dc=example,dc=test]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2SchemaVersion & [dkim2-datasource-v2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2DatasetState & [staging])" =dcsra
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by * none

# V3 administrative metadata is never writable by the legacy v2 publisher.
access to dn.regex="^dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=dkim2CandidateDigest,dkim2OperationID
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" =dcsra
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" read
    by * none

# The stager can seal only a still-staging v3 root; the legacy publisher can
# seal only its v2 root. Neither authority receives entry-delete rights.
access to dn.regex="^dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=dkim2DatasetState
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by set.expand="(user & [cn=dkim2-stager,ou=services,dc=example,dc=test]) + (this/dkim2SchemaVersion & [dkim2-datasource-v3]) + (this/dkim2Generation & [$1]) + (this/dkim2DatasetState & [staging]) + this/dkim2OperationID + this/dkim2CandidateDigest" =dcsraz
    by set.expand="(user & [cn=dkim2-publisher,ou=services,dc=example,dc=test]) + (this/dkim2SchemaVersion & [dkim2-datasource-v2]) + (this/dkim2Generation & [$1]) + (this/dkim2DatasetState & [staging])" =dcsraz
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" read
    by * none

# Only the activator may add monotonic history evidence, and only to the exact
# committed root currently named by cn=current.
access to dn.regex="^dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=dkim2WasActive
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by set.expand="(user & [cn=dkim2-activator,ou=services,dc=example,dc=test]) + (this/dkim2Generation & [$1]) + (this/dkim2DatasetState & [committed]) + ([cn=current,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$1])" =dcsra
    by * none

# Add-only generation-root creation. Every child/content write below it is
# separately conditioned on the exact root metadata and staging state.
access to dn.exact="ou=generations,ou=dkim2,dc=example,dc=test"
    attrs=children
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" =dcsra
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsra
    by * none
access to dn.regex="^dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=entry
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" =dcsra
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsra
    by * none

# Child creation is allowed only while the captured generation root is exact
# staging state. The concatenated set is nonempty only when every operand is.
access to dn.regex="^(.+,)?dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=children
    by set.expand="(user & [cn=dkim2-stager,ou=services,dc=example,dc=test]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2SchemaVersion & [dkim2-datasource-v3]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2DatasetState & [staging]) + [dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2OperationID + [dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2CandidateDigest" =a
    by set.expand="(user & [cn=dkim2-publisher,ou=services,dc=example,dc=test]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2SchemaVersion & [dkim2-datasource-v2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2DatasetState & [staging])" =a
    by * none

# Public generation content has the same exact staging gate. Activator is read
# only and therefore cannot mutate candidate roots, containers, or records.
access to dn.regex="^(.+,)?dkim2Generation=([0-9]+),ou=generations,ou=dkim2,dc=example,dc=test$"
    attrs=entry,objectClass,cn,ou,dkim2SchemaVersion,dkim2Generation,dkim2HandleID,dkim2ProfileID,dkim2SigningDomain,dkim2RecordStatus,dkim2NotBefore,dkim2NotAfter,dkim2Algorithm,dkim2Selector,dkim2PublicKeySPKI,dkim2TenantID,dkim2ProfileUse,dkim2Rollout,dkim2Compatibility,dkim2FeedbackRouteID
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by set.expand="(user & [cn=dkim2-stager,ou=services,dc=example,dc=test]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2SchemaVersion & [dkim2-datasource-v3]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2DatasetState & [staging]) + [dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2OperationID + [dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2CandidateDigest" =dcsra
    by set.expand="(user & [cn=dkim2-publisher,ou=services,dc=example,dc=test]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2SchemaVersion & [dkim2-datasource-v2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2Generation & [$2]) + ([dkim2Generation=$2,ou=generations,ou=dkim2,dc=example,dc=test]/dkim2DatasetState & [staging])" =dcsra
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" read
    by * none

# Current digest and auxiliary class are v3 activation-only. The legacy v2
# publisher can still move core v2 fields but cannot create valid v3 metadata.
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    attrs=dkim2CandidateDigest
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" =dcsraz
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    attrs=dkim2OperationID,dkim2WasActive
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by * none
# The legacy publisher receives current-entry/core write rights only while the
# target itself is exact committed v2 metadata with every v3/history field
# absent. The following general rules therefore cannot be used to edit v3.
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    filter="(&(objectClass=dkim2Dataset)(dkim2SchemaVersion=dkim2-datasource-v2)(dkim2Generation=*)(dkim2DatasetState=committed)(!(dkim2CandidateDigest=*))(!(dkim2OperationID=*))(!(dkim2WasActive=*)))"
    attrs=entry
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" =dcsra
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsra
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    attrs=entry
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" =dcsra
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    filter="(&(objectClass=dkim2Dataset)(dkim2SchemaVersion=dkim2-datasource-v2)(dkim2Generation=*)(dkim2DatasetState=committed)(!(dkim2CandidateDigest=*))(!(dkim2OperationID=*))(!(dkim2WasActive=*)))"
    attrs=objectClass,cn,dkim2SchemaVersion,dkim2Generation,dkim2DatasetState
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" =dcsraz
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsraz
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    attrs=objectClass,cn,dkim2SchemaVersion,dkim2Generation,dkim2DatasetState
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" =dcsraz
    by * none
access to dn.exact="ou=dkim2,dc=example,dc=test"
    attrs=children
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" =a
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =a
    by * none

# Base/container discovery without mutation.
access to dn.subtree="ou=dkim2,dc=example,dc=test"
    attrs=entry,objectClass,ou,cn
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-snapshot,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-stager,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-activator,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" read
    by * none
