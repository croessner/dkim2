name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - features
      - release/**
  pull_request:
    branches:
      - main
      - features
      - release/**
  schedule:
    - cron: "23 2 * * 0"

permissions:
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare protected CI temporary directory
        id: ci_environment
        run: scripts/prepare-ci-environment.sh prepare

      - name: Install exact Go toolchain
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            go.work.sum
            lib/go.sum
            cmd/dkim2d/go.sum
            cmd/dkim2-milter/go.sum
            cmd/dkim2-exim/go.sum
            cmd/dkim2ctl/go.sum
            tools/go.sum

      - name: Require vendored Go dependencies
        if: matrix.language == 'go'
        run: echo 'GOFLAGS=-mod=vendor' >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild Go
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Build the Exim C adapter
        if: matrix.language == 'c-cpp'
        env:
          DKIM2_EXIM_SKIP_SANITIZERS: "1"
        run: make test-exim-local-scan

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          output: .artifacts/codeql/${{ matrix.language }}
          upload: never
          upload-database: false

      - name: Retain local CodeQL SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dkim2-codeql-${{ matrix.language }}
          path: .artifacts/codeql/${{ matrix.language }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Remove protected CI temporary directory
        if: ${{ always() && steps.ci_environment.outcome == 'success' }}
        run: scripts/prepare-ci-environment.sh cleanup
