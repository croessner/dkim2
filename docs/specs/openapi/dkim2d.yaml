        - received_dsn_structure_invalid
        - received_dsn_embedded_unverified
        - received_dsn_embedded_absent
        - received_dsn_temporary_failure
        - received_dsn_tenant_unavailable
        - received_dsn_identity_mismatch
        - received_dsn_not_local
