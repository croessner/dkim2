version: dkim2-exim-config-v1
daemon:
  endpoint: http://127.0.0.1:8080
  sign_capability_file: /etc/dkim2/sign-secret/sign.cap
  request_timeout: 2s
signing:
  tenant: tenant-a
  domain: example.test
limits:
  message_bytes: 33554432
  header_bytes: 1048576
  header_count: 2000
  header_field_bytes: 65536
  recipient_count: 1
observability:
  logging:
    level: info
    destination: none
