name: Conformance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - features
      - release/**
  pull_request:
    branches:
      - main
      - features
      - release/**

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-linux-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare protected CI temporary directory
        id: ci_environment
        run: scripts/prepare-ci-environment.sh prepare

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - name: Check out immutable Valkey source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: valkey-io/valkey
          ref: c9e8005e9d0ec817e26c7db318861cb821409249
          path: .artifacts/valkey-src
          persist-credentials: false

      - name: Build exact Valkey test binary
        run: scripts/install-valkey-ci.sh

      - name: Validate and run portable profile
        run: |
          make check-conformance
          make check-reference
          make conformance
          go -C tools test ./cmd/conformance \
            -run '^TestFullProfileRejectsMissingEximEvidence$'

      - name: Run real Postfix profile
        run: make conformance-postfix

      - name: Install the pinned vulnerability scanner
        run: scripts/install-ci-tools.sh govulncheck

      - name: Run portable security gates
        run: |
          make check-security
          make fuzz-security
          make race-security
          make vulnerability-security

      - name: Prove generated tree cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Retain deterministic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dkim2-conformance-reports
          path: |
            .artifacts/conformance-portable/
            .artifacts/conformance-postfix/
            .artifacts/security/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Remove protected CI temporary directory
        if: ${{ always() && steps.ci_environment.outcome == 'success' }}
        run: scripts/prepare-ci-environment.sh cleanup
