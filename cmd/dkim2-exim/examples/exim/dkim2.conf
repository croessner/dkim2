# Required representation contract.
spool_wireformat = false
local_scan_timeout = 12s

# Source-matched local_scan module options use the same protected service socket.
begin local_scan

dkim2_spool_format = unix_lf
dkim2_socket = /run/dkim2-exim/local-scan.sock
dkim2_timeout = 11s

begin transports

dkim2_sign:
  driver = smtp
  transport_filter = /usr/libexec/dkim2-exim --config /etc/dkim2/sign.yaml filter sign -- '$dkim2_transport_filter_return_path' '$pipe_addresses'
  max_rcpt = 1
  size_addition = -1
  transport_filter_timeout = 11s
  user = Debian-exim
  group = Debian-exim

dkim2_revise:
  driver = smtp
  transport_filter = /usr/libexec/dkim2-exim --config /etc/dkim2/revise.yaml filter revise -- '$local_scan_data' '$dkim2_transport_filter_return_path' '$pipe_addresses'
  max_rcpt = 1
  size_addition = -1
  transport_filter_timeout = 11s
  user = Debian-exim
  group = Debian-exim

# No transport or router may add, remove, rewrite, or normalize headers after
# either filter. Rollback stops Exim, restores the source-matched package, and
# removes these transports before restarting the prior configuration.
