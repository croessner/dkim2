# Illustrative least-privilege split. Replace only the example DNs and suffix.
# Keep the private-attribute rule before the public datasource rule.
access to dn.subtree="ou=dkim2,dc=example,dc=test"
    attrs=dkim2PrivateKeyPKCS8
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsra
    by * none
access to dn.exact="ou=dkim2,dc=example,dc=test"
    attrs=children
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =a
    by * none
access to dn.subtree="ou=generations,ou=dkim2,dc=example,dc=test"
    attrs=dkim2DatasetState
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsraz
    by * none
access to dn.subtree="ou=generations,ou=dkim2,dc=example,dc=test"
    attrs=entry,children,objectClass,cn,ou,dkim2SchemaVersion,dkim2Generation,dkim2HandleID,dkim2ProfileID,dkim2SigningDomain,dkim2RecordStatus,dkim2NotBefore,dkim2NotAfter,dkim2Algorithm,dkim2Selector,dkim2PublicKeySPKI,dkim2TenantID,dkim2ProfileUse,dkim2Rollout,dkim2Compatibility,dkim2FeedbackRouteID
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsra
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    attrs=dkim2SchemaVersion,dkim2Generation,dkim2DatasetState
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsraz
    by * none
access to dn.exact="cn=current,ou=dkim2,dc=example,dc=test"
    attrs=entry,objectClass,cn
    by dn.exact="cn=dkim2-runtime,ou=services,dc=example,dc=test" read
    by dn.exact="cn=dkim2-publisher,ou=services,dc=example,dc=test" =dcsra
    by * none
